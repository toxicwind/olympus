# Per-pen pitchfork config partitioned from estate monolith 2026-10-29
[daemons.skopos]
# 2026-10-24: consolidated onto olympus/products/skopos (canonical keeper).
# daemon = bin/keeper.ts, failover = bin/skopos.ts, MCP = src/. The old
# ranch/keeper CJS copy is retired; nothing points at it.
run = "cd /home/toxic/pens/olympus/products/skopos && exec /home/toxic/.bun/bin/bun run bin/keeper.ts"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25236/"
port = 25236
boot_start = true
depends = ["estate/agent-display"]
dir = "/home/toxic/pens/olympus/products/skopos"
mise = true

[daemons.lambda]
run = "exec /home/toxic/pens/barn/estate-ops/claim-port 25126 /home/toxic/pens/olympus/products/lambda/apps/kimi-code/dist/main.mjs web --no-open --port 25126"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25126/health"
port = 25126
depends = ["barn/thresher"]
dir = "/home/toxic/pens/olympus/products/lambda"


[daemons.sigma-guard]
# 2026-10-27: sigma was an ORPHANED product — nothing served it, and the
# SIGMA_GUARD_URL keyring entry pointed at grafana's :25210/mcp (not an MCP
# server). One proxy, one shared stdio entry, consumed by BOTH tau
# extensions and kappa plugins (see config/tau/mcp.json + ~/.config/kappa/
# kappa.json). This daemon keeps the proxy alive; the guard entry talks to
# it.
run = "exec /home/toxic/pens/olympus/products/sigma/dist/index.js start"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:8787/__bili/stats"
port = 8787
dir = "/home/toxic/pens/olympus/products/sigma"
mise = false


[daemons.skopos-failover]
mise = true
run = "exec /home/toxic/.bun/bin/bun run /home/toxic/pens/olympus/products/skopos/bin/skopos-failover.ts"
dir = "/home/toxic/pens/olympus/products/skopos"
retry = true
depends = ["estate/agent-display"]
env = { DISPLAY = ":99", XDG_RUNTIME_DIR = "/run/user/1000", BROWSER_KEEPER_CDP_PORT = "25233", BROWSER_KEEPER_CDP = "http://127.0.0.1:25233", KEEPER_FAILOVER = "1", KEEPER_FAILOVER_GRACE_S = "15" }
# KEEPER_CHROMIUM_EXECUTABLE removed 2026-10-29: was pinned to playwright
# chromium-1243 which no longer exists (cache rotated to 1228) — the pinned
# ghost path made the respawn loop ENOENT forever (skopos freeze root cause).
# resolveChromium() scans ms-playwright for the newest live rev each respawn.
# on-demand takeover; the drop-in's FAILOVER loop polls :25233 and only spawns
# chromium when the primary has been down past the grace period, so only one
# server binds at a time. boot_start true so the probe loop is always supervised.
boot_start = true
auto = ["start"]



